<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="mcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Server base -->
  <rect x="3" y="4" width="18" height="16" rx="2" fill="url(#mcGradient)" stroke="#1B5E20" stroke-width="0.5"/>
  <!-- Server lines -->
  <rect x="5" y="7" width="10" height="2" rx="0.5" fill="#E8F5E9"/>
  <rect x="5" y="11" width="8" height="2" rx="0.5" fill="#E8F5E9"/>
  <rect x="5" y="15" width="12" height="2" rx="0.5" fill="#E8F5E9"/>
  <!-- Status LED -->
  <circle cx="18" cy="8" r="1.5" fill="#76FF03"/>
  <!-- Play button indicator -->
  <polygon points="17,13 17,17 20,15" fill="#E8F5E9"/>
</svg>

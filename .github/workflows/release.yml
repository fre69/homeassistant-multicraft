name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ### HACS (Recommended / Recommandé)
            1. Open HACS in Home Assistant / Ouvrez HACS dans Home Assistant
            2. Search for "Multicraft" / Recherchez "Multicraft"
            3. Click "Download" / Cliquez sur "Télécharger"
            4. Restart Home Assistant / Redémarrez Home Assistant

            ### Manual / Manuel
            1. Download the zip file below / Téléchargez le fichier zip ci-dessous
            2. Extract to `config/custom_components/multicraft/` / Extrayez dans `config/custom_components/multicraft/`
            3. Restart Home Assistant / Redémarrez Home Assistant

            ---
            See the [CHANGELOG](https://github.com/fre69/homeassistant-multicraft/blob/main/CHANGELOG.md) for details. / Voir le [CHANGELOG](https://github.com/fre69/homeassistant-multicraft/blob/main/CHANGELOG.md) pour les détails.
